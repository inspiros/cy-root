name: Tests

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  native-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native ownership and signed-stride views
        shell: bash
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Icyroot tests/native/test_buffers.cpp -o "${RUNNER_TEMP}/cyroot-native-buffers"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 "${RUNNER_TEMP}/cyroot-native-buffers"

  installed-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.11'
            minimum-dependencies: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify isolated test runner
        run: python tests/run_tests.py --self-check
      - name: Build wheel and source archive
        if: ${{ !matrix.minimum-dependencies }}
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Build with minimum dependencies
        if: ${{ matrix.minimum-dependencies }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'setuptools==78.0.1' 'Cython==3.3.0' 'numpy==2.0.0' 'scipy==1.13.0' wheel build
          python -m build --no-isolation
      - name: Verify wheel contents
        run: python tests/check_distribution.py dist
      - name: Install and test wheel outside checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m pip install "${GITHUB_WORKSPACE}"/dist/*.whl 'Cython==3.3.0' setuptools
          python "${GITHUB_WORKSPACE}/tests/run_tests.py" --jobs 4 --installed-prefix --log-directory "${RUNNER_TEMP}/cyroot-wheel-test-logs"
      - name: Upload wheel test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/cyroot-wheel-test-logs
          if-no-files-found: ignore
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*

  sdist-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - run: python -m build --sdist
      - name: Install source archive and test outside checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m pip install "${GITHUB_WORKSPACE}"/dist/*.tar.gz 'Cython==3.3.0' setuptools
          python "${GITHUB_WORKSPACE}/tests/run_tests.py" --jobs 4 --installed-prefix --log-directory "${RUNNER_TEMP}/cyroot-sdist-test-logs"
      - name: Upload source archive test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-sdist
          path: ${{ runner.temp }}/cyroot-sdist-test-logs
          if-no-files-found: ignore
