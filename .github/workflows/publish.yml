name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v2.0.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build_wheels.yml
    with:
      ref: refs/tags/${{ inputs.tag }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.pypi_password }}
