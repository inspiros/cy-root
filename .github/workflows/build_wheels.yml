name: Build

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      ref:
        description: Version tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check tag matches package version
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref }}
        run: |
          python - <<'PY'
          import os, runpy
          version = runpy.run_path('cyroot/_version.py')['__version__']
          expected = f'refs/tags/v{version}'
          if os.environ['RELEASE_REF'] != expected:
              raise SystemExit(f'Release ref must match package version: {expected}')
          PY

  build-sdist:
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build --sdist
      - run: python tests/check_distribution.py dist
      - name: Install and test source archive outside checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m pip install "${GITHUB_WORKSPACE}"/dist/*.tar.gz 'Cython==3.3.0' setuptools
          python "${GITHUB_WORKSPACE}/tests/run_tests.py" --jobs 4 --installed-prefix --log-directory "${RUNNER_TEMP}/cyroot-sdist-test-logs"
      - uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz

  build-wheels:
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'cibuildwheel>=3.2,<4'
      - run: python -m cibuildwheel --output-dir wheelhouse
      - run: python tests/check_distribution.py wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

